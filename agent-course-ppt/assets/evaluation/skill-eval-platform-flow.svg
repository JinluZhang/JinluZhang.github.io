  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M95 122C292 28 477 64 625 145C814 248 900 141 1071 91C1213 50 1371 70 1510 156" stroke="#1F3B57" stroke-width="2" opacity="0.5"/>
  <path d="M98 866C311 773 451 834 612 895C774 956 898 882 1058 812C1240 732 1389 801 1510 877" stroke="#1F3B57" stroke-width="2" opacity="0.45"/>

  <text x="92" y="96" class="title">OpenClaw 商家端 Agent 质量闭环</text>
  <text x="94" y="139" class="subtitle">开发准入评测 -> 线上真实对话评测 -> 运行监控告警 -> BadCase 回流治理</text>

  <g transform="translate(615 330)" filter="url(#softGlow)">
    <circle cx="185" cy="185" r="166" fill="rgba(15,23,42,0.78)" stroke="#67E8F9" stroke-width="2.5"/>
    <circle cx="185" cy="185" r="118" fill="rgba(8,13,25,0.82)" stroke="#334155"/>
    <text x="185" y="154" text-anchor="middle" class="stage-title">质量闭环</text>
    <text x="185" y="192" text-anchor="middle" class="body">用评测发现问题</text>
    <text x="185" y="224" text-anchor="middle" class="body">用监控定位问题</text>
    <text x="185" y="256" text-anchor="middle" class="body">用回流持续修复</text>
  </g>

  <path d="M500 291C604 198 758 171 900 213" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1113 371C1190 495 1164 653 1049 742" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M911 812C759 861 600 816 501 704" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M374 611C311 482 345 348 455 259" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

