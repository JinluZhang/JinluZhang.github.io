    <rect x="0" y="0" width="420" height="86" rx="30" fill="url(#stage2)"/>
    <text x="34" y="52" class="stage-title">2. 线上对话评测</text>
    <text x="34" y="116" class="stage-subtitle">真实用户 query | 线上</text>
