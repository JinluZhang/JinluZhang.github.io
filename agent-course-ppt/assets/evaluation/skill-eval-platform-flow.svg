    <rect x="0" y="0" width="420" height="86" rx="30" fill="url(#stage1)"/>
    <text x="34" y="52" class="stage-title">1. 开发准入评测</text>
    <text x="34" y="116" class="stage-subtitle">SKILL 评测平台 | 线下</text>
    <text x="34" y="153" class="body">准入评测、路由回测、冲突分析</text>
    <text x="34" y="184" class="body">SKILL 仓库、断言、数据集治理</text>
    <g transform="translate(34 210)">
      <rect width="105" height="34" rx="17" fill="rgba(14,165,233,0.18)" stroke="#38BDF8"/>
      <text x="52.5" y="23" text-anchor="middle" class="chip">46 managed</text>
      <rect x="118" width="100" height="34" rx="17" fill="rgba(20,184,166,0.18)" stroke="#2DD4BF"/>
      <text x="168" y="23" text-anchor="middle" class="chip">31 断言</text>
      <rect x="231" width="122" height="34" rx="17" fill="rgba(99,102,241,0.18)" stroke="#818CF8"/>
      <text x="292" y="23" text-anchor="middle" class="chip">49 次回测</text>
