    <text x="34" y="184" class="body">案例库、任务集、评估运行、下钻复核</text>
    <g transform="translate(34 210)">
      <rect width="132" height="34" rx="17" fill="rgba(34,197,94,0.18)" stroke="#86EFAC"/>
      <text x="66" y="23" text-anchor="middle" class="chip">12,234 对话</text>
      <rect x="145" width="116" height="34" rx="17" fill="rgba(34,197,94,0.18)" stroke="#86EFAC"/>
      <text x="203" y="23" text-anchor="middle" class="chip">100 品牌</text>
      <rect x="274" width="104" height="34" rx="17" fill="rgba(34,197,94,0.18)" stroke="#86EFAC"/>
      <text x="326" y="23" text-anchor="middle" class="chip">64.4%</text>
    </g>
  </g>

  <g transform="translate(1064 665)" filter="url(#shadow)">
