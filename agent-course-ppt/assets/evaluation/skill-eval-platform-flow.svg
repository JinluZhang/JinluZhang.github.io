    <text x="34" y="116" class="stage-subtitle">监控平台 | 生产运行</text>
    <text x="34" y="153" class="body">沙箱、Cron、Skill 调用、对话质量</text>
    <text x="34" y="184" class="body">日志、基础监控、告警、成本与耗时</text>
    <g transform="translate(34 210)">
      <rect width="120" height="34" rx="17" fill="rgba(249,115,22,0.18)" stroke="#FDBA74"/>
      <text x="60" y="23" text-anchor="middle" class="chip">216 沙箱</text>
      <rect x="133" width="128" height="34" rx="17" fill="rgba(249,115,22,0.18)" stroke="#FDBA74"/>
      <text x="197" y="23" text-anchor="middle" class="chip">17,119 query</text>
      <rect x="274" width="104" height="34" rx="17" fill="rgba(249,115,22,0.18)" stroke="#FDBA74"/>
      <text x="326" y="23" text-anchor="middle" class="chip">747 告警</text>
    </g>
  </g>

  <g transform="translate(116 665)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="260" rx="30" fill="rgba(15,23,42,0.94)" stroke="rgba(216,180,254,0.58)" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="86" rx="30" fill="url(#stage4)"/>
    <text x="34" y="52" class="stage-title">4. BadCase 回流治理</text>
    <text x="34" y="116" class="stage-subtitle">治理清单 | 负责人闭环</text>
    <text x="34" y="153" class="body">真实失败样本回流数据集和断言</text>
    <text x="34" y="184" class="body">修 SKILL.md、边界、流程和工具稳定性</text>
    <g transform="translate(34 210)">
      <rect width="118" height="34" rx="17" fill="rgba(168,85,247,0.18)" stroke="#D8B4FE"/>
      <text x="59" y="23" text-anchor="middle" class="chip">FN 治理</text>
      <rect x="131" width="128" height="34" rx="17" fill="rgba(168,85,247,0.18)" stroke="#D8B4FE"/>
      <text x="195" y="23" text-anchor="middle" class="chip">冲突治理</text>
      <rect x="272" width="108" height="34" rx="17" fill="rgba(168,85,247,0.18)" stroke="#D8B4FE"/>
      <text x="326" y="23" text-anchor="middle" class="chip">回归验证</text>
    </g>
  </g>

  <g transform="translate(578 166)">
    <rect x="0" y="0" width="444" height="86" rx="22" fill="rgba(2,6,23,0.72)" stroke="#334155"/>
    <text x="28" y="34" class="label">路由质量现状</text>
    <text x="28" y="65" class="body">最近回测：489 用例，TP 416，FN 73，FP 0，F1 91.93%</text>
  </g>

  <g transform="translate(578 760)">
    <rect x="0" y="0" width="444" height="100" rx="22" fill="rgba(2,6,23,0.72)" stroke="#334155"/>
    <text x="28" y="34" class="label">治理主矛盾</text>
    <text x="28" y="65" class="body">从“有没有能力”转向“边界清晰 + 执行稳定”</text>
    <text x="28" y="90" class="small">Skill 执行失败 48.6%，任务未闭环 19.6%</text>
  </g>

  <path d="M800 291V252" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M800 682V760" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <g transform="translate(90 522)">
    <rect x="0" y="0" width="370" height="80" rx="18" fill="rgba(15,23,42,0.62)" stroke="#334155"/>
    <text x="24" y="32" class="label">治理重点</text>
    <text x="24" y="60" class="small">广告/推广、评价、商品上下架、拼好饭、登录授权、经营查询</text>
  </g>

  <g transform="translate(1140 522)">
    <rect x="0" y="0" width="370" height="80" rx="18" fill="rgba(15,23,42,0.62)" stroke="#334155"/>
    <text x="24" y="32" class="label">监控重点</text>
    <text x="24" y="60" class="small">Fallback、执行失败、耗时、Token 高消耗、告警趋势</text>
  </g>

  <g transform="translate(92 940)">
    <text class="small">数据来源：OpenClaw 评测平台、线上对话评测、CatClaw 监控平台接口抽样。部分指标仍需确认时间口径和生产环境映射。</text>
  </g>
</svg>
